
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hand Gesture AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #080d18;
      color: #eaf2ff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 { color: #64e8ff; }
    p { color: #a9b8d0; }
    .camera {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 20px auto;
      overflow: hidden;
      border: 1px solid #31506d;
      border-radius: 16px;
      background: #111827;
    }
    video {
      display: block;
      width: 100%;
      transform: scaleX(-1);
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      pointer-events: none;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 20px;
      background: #64e8ff;
      color: #07111b;
      font-weight: bold;
      font-size: 16px;
    }
    #status, #gesture {
      margin: 14px 0;
      overflow-wrap: anywhere;
    }
    #gesture {
      font-size: 23px;
      color: #64e8ff;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>HAND GESTURE AI</h1>
  <p>Real-time hand gesture recognition</p>

  <div class="camera">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <button id="start">NYALAKAN KAMERA</button>
  <p id="status">Status: menunggu</p>
  <div id="gesture">Belum ada gesture</div>
  <p>✋ Open Palm · ✊ Fist · ✌️ Victory</p>

  <script type="module">
    import {
      FilesetResolver,
      GestureRecognizer
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";
     const vision = await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
);
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");
    const gestureText = document.getElementById("gesture");
    const startButton = document.getElementById("start");

    let recognizer;
    let running = false;
    let lastVideoTime = -1;

    const names = {
      Open_Palm: "✋ TELAPAK TERBUKA",
      Closed_Fist: "✊ TANGAN MENGEPAL",
      Victory: "✌️ VICTORY / PEACE",
      Pointing_Up: "☝️ MENUNJUK KE ATAS",
      Thumb_Up: "👍 THUMBS UP",
      Thumb_Down: "👎 THUMBS DOWN",
      ILoveYou: "🤟 I LOVE YOU",
      None: "Gesture belum dikenali"
    };

    async function setupAI() {
      status.textContent = "Memuat AI... tunggu sebentar";

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
      );

      recognizer = await GestureRecognizer.createFromOptions(
        vision,
        {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-tasks/gesture_recognizer/gesture_recognizer.task",
            delegate: "CPU"
          },
          runningMode: "VIDEO",
          numHands: 1,
          minHandDetectionConfidence: 0.55,
          minHandPresenceConfidence: 0.55,
          minTrackingConfidence: 0.55
        }
      );
    }

    function drawHand(landmarks) {
      const links = GestureRecognizer.HAND_CONNECTIONS;

      ctx.strokeStyle = "#64e8ff";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";

      for (const link of links) {
        const a = landmarks[link.start];
        const b = landmarks[link.end];

        if (!a || !b) continue;

        ctx.beginPath();
        ctx.moveTo(a.x * canvas.width, a.y * canvas.height);
        ctx.lineTo(b.x * canvas.width, b.y * canvas.height);
        ctx.stroke();
      }

      ctx.fillStyle = "#ffffff";

      for (const point of landmarks) {
        ctx.beginPath();
        ctx.arc(
          point.x * canvas.width,
          point.y * canvas.height,
          4, 0, Math.PI * 2
        );
        ctx.fill();
      }
    }

    function loop() {
      if (!running) return;

      if (video.readyState >= 2 &&
          video.currentTime !== lastVideoTime) {

        if (canvas.width !== video.videoWidth ||
            canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }

        try {
          const result = recognizer.recognizeForVideo(
            video, performance.now()
          );

          ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (result.landmarks.length > 0) {
            const detected = result.gestures[0]?.[0];
            const label = detected?.categoryName || "None";
            const confidence = detected
              ? Math.round(detected.score * 100)
              : 0;

            gestureText.textContent =
              (names[label] || label) + " · " + confidence + "%";
          } else {
            gestureText.textContent = "Tangan belum terdeteksi";
          }

          lastVideoTime = video.currentTime;
        } catch (error) {
          status.textContent = "Gagal memproses frame: " + error.message;
          running = false;
          return;
        }
      }

      requestAnimationFrame(loop);
    }

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;

      try {
        if (!recognizer) await setupAI();

        status.textContent = "Meminta izin kamera...";

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "user",
            width: { ideal: 480 },
            height: { ideal: 360 },
            frameRate: { ideal: 15, max: 20 }
          }
        });

        video.srcObject = stream;
        await video.play();

        running = true;
        status.textContent = "Kamera aktif · AI berjalan";
        startButton.textContent = "KAMERA AKTIF";
        loop();
      } catch (error) {
        status.textContent =
          "Error: " + error.message +
          ". Periksa koneksi internet, izin kamera, dan HTTPS.";
        startButton.disabled = false;
      }
    });
  </script>
</body>
</html>
